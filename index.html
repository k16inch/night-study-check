<!DOCTYPE html>
<html lang="ko">
<head>
  
  <!-- 🛡️ 클릭재킹 방어 (다른 사이트의 iframe 삽입 차단) -->
  <script>if (top !== self) top.location.href = self.location.href;</script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2학년 자습 바코드 출석 체크</title>
  <!-- HTML5 QR/Barcode Code 스캐너 라이브러리 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    
    /* 전체 컨테이너 및 헤더 */
    .app-header { max-width: 960px; margin: 0 auto 12px auto; text-align: center; }
    h2 { color: #1e293b; font-size: 1.4rem; margin-bottom: 2px; }
    .sub-title { color: #64748b; font-size: 0.85rem; margin-bottom: 6px; }
    
    .db-status {
      display: inline-block;
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: #e2e8f0;
      color: #475569;
      font-weight: 500;
    }
    .db-status.success { background: #dcfce7; color: #15803d; }
    .db-status.error { background: #fee2e2; color: #b91c1c; }

    /* 메인 그리드 레이아웃 (노트북 화면: 2열 배치) */
    .main-grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: 1.05fr 0.95fr;
        align-items: start;
      }
    }

    .left-col, .right-col { display: flex; flex-direction: column; gap: 14px; }

    .card { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    /* 1. 현황판 스타일 */
    .total-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0284c7;
      color: #fff;
      padding: 18px 20px;
    }
    .total-card span { font-size: 1.05rem; font-weight: 500; }
    .total-card strong { font-size: 1.8rem; font-weight: bold; }

    /* 2. 카메라 영역 및 제어 버튼 */
    .camera-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .camera-header h3 { font-size: 1rem; color: #334155; }
    
    .btn-cam {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-cam.stop { background: #ef4444; color: white; }
    .btn-cam.start { background: #22c55e; color: white; }

    #reader { width: 100%; border-radius: 6px; overflow: hidden; background: #000; min-height: 180px; }
    #feedback { margin-top: 10px; text-align: center; font-size: 0.95rem; font-weight: bold; color: #0284c7; word-break: break-all; }
    .warning { color: #dc2626 !important; font-weight: bold; }

    /* 3. USB 리더기 수동 입력 폼 */
    #manual-form { display: flex; gap: 8px; }
    #manual-form input { 
      flex: 1; 
      padding: 12px 14px; 
      border: 2px solid #0284c7; 
      border-radius: 6px; 
      font-size: 1rem; 
      background-color: #f0f9ff;
      font-weight: 500;
      ime-mode: disabled;
    }
    #manual-form input:focus { outline: none; background-color: #ffffff; border-color: #0369a1; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2); }
    #manual-form button { padding: 10px 16px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* 4. 오른쪽 영역: 표 형식 명단 리스트 */
    .label-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .label { font-size: 0.95rem; color: #334155; font-weight: bold; }
    
    .btn-group-sm { display: flex; gap: 6px; align-items: center; }
    
    .btn-sort {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-sort.active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }

    .btn-sync { background: none; border: none; color: #0284c7; text-decoration: underline; cursor: pointer; font-size: 0.8rem; margin-left: 2px; }
    .btn-reset { background: #f1f5f9; border: 1px solid #cbd5e1; color: #ef4444; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-reset:hover { background: #fee2e2; }

    /* 📊 표(Table) 전용 스타일 */
    .attendance-table-container {
      height: 380px;
      overflow-y: auto;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
    }

    .attendance-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }

    .attendance-table th {
      position: sticky;
      top: 0;
      background: #f1f5f9;
      color: #334155;
      font-weight: bold;
      padding: 10px 12px;
      border-bottom: 2px solid #cbd5e1;
      z-index: 10;
    }

    .attendance-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #e2e8f0;
      color: #0f172a;
    }

    .attendance-table tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .attendance-table tr:hover {
      background-color: #f0f9ff;
    }

    .col-num { width: 50px; text-align: center; color: #64748b; font-weight: bold; }
    .col-info { font-weight: bold; color: #0f172a; word-break: break-all; }
    .col-time { width: 95px; text-align: right; color: #64748b; font-size: 0.8rem; }
    
    .empty-msg-td { text-align: center; color: #94a3b8; padding: 40px 0 !important; }
    .sync-status { font-size: 0.8rem; color: #0284c7; text-align: right; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- 🔒 PIN 비밀번호 잠금 화면 레이어 -->
  <div id="lock-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#f4f6f9; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px;">
    <div style="background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:center; max-width:320px; width:100%;">
      <h3 style="margin-bottom:8px; color:#1e293b;">🔒 야자 출석 시스템</h3>
      <p style="font-size:0.85rem; color:#64748b; margin-bottom:20px;">관리자 4자리 PIN 번호를 입력하세요.</p>
      <form id="pin-form" onsubmit="checkPin(event)">
        <input type="password" id="pin-input" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="PIN 번호 입력" style="width:100%; padding:12px; font-size:1.2rem; text-align:center; border:2px solid #0284c7; border-radius:8px; margin-bottom:12px; letter-spacing:4px;" required autofocus>
        <button type="submit" style="width:100%; padding:12px; background:#0284c7; color:#fff; border:none; border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer;">확인</button>
      </form>
      <p id="pin-error" style="color:#ef4444; font-size:0.8rem; margin-top:10px; display:none;">⚠️ 비밀번호가 일치하지 않습니다.</p>
    </div>
  </div>

  <!-- 헤더 영역 -->
  <div class="app-header">
    <h2>🌙 2학년 자습 바코드 출석 체크</h2>
    <p class="sub-title" id="current-date"></p>
    <div id="db-status-bar" class="db-status">🔄 구글 시트에서 학생 명단 불러오는 중...</div>
  </div>

  <!-- 메인 레이아웃 -->
  <div class="main-grid">
    
    <!-- 왼쪽 컬럼: 현황판, 카메라, 수동 입력창 -->
    <div class="left-col">
      <div class="card total-card">
        <span>오늘 출석 인원</span>
        <strong id="count">0명</strong>
      </div>

      <div class="card">
        <div class="camera-header">
          <h3>📷 바코드 스캐너</h3>
          <button id="cam-toggle-btn" class="btn-cam start" onclick="toggleCamera()">카메라 켜기</button>
        </div>
        <div id="reader"></div>
        <p id="feedback">카메라를 켜고 학생증 바코드를 스캔하세요.</p>
      </div>

      <div class="card">
        <form id="manual-form">
          <input type="text" id="manual-input" placeholder="학번 또는 바코드 수동 입력" autocomplete="off" required>
          <button type="submit">등록</button>
        </form>
      </div>
    </div>

    <!-- 오른쪽 컬럼: 당일 등록 학생 표(Table) 명단 -->
    <div class="right-col">
      <div class="card" style="height: 100%;">
        <div class="label-group">
          <span class="label">📋 오늘 출석 명단</span>
          <div class="btn-group-sm">
            <button id="btn-sort-time" class="btn-sort active" onclick="setSortMode('time')">시간순</button>
            <button id="btn-sort-class" class="btn-sort" onclick="setSortMode('class')">학번순</button>
            <button class="btn-sync" onclick="syncOfflineData()">🔄 동기화</button>
            <button class="btn-reset" onclick="clearTodayData()">🗑️ 초기화</button>
          </div>
        </div>
        
        <!-- 📊 표(Table) 레이아웃 적용 컨테이너 -->
        <div class="attendance-table-container">
          <table class="attendance-table">
            <thead>
              <tr>
                <th class="col-num">No.</th>
                <th class="col-info">학생 정보 (학번/이름)</th>
                <th class="col-time">출석 시간</th>
              </tr>
            </thead>
            <tbody id="attendance-tbody">
              <tr>
                <td colspan="3" class="empty-msg-td">아직 등록된 학생이 없습니다.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="sync-status" id="offline-count-status">미전송 대기: 0건</div>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PIN = "1592";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwjeIzlcIxMgZp-M3Jrd7m7woHEQUZKlBPPogyGmTHbkug32TxLQrQy3KRYExaymxs/exec";

    let html5QrCode = null;
    let isCameraRunning = false;
    let isProcessing = false;
    let currentSortMode = 'time';
    
    let studentDB = {};

    const todayKey = new Date().toISOString().split('T')[0];
    
    let attendanceData = JSON.parse(localStorage.getItem(`attendance_list_${todayKey}`)) || [];
    let offlineQueue = JSON.parse(localStorage.getItem(`offline_queue_${todayKey}`)) || [];

    let audioCtx = null;

    function checkPin(e) {
      e.preventDefault();
      const inputPin = document.getElementById('pin-input').value;
      const errorMsg = document.getElementById('pin-error');

      if (inputPin === ADMIN_PIN) {
        document.getElementById('lock-screen').style.display = 'none';
        fetchStudentList();
        setTimeout(focusInput, 200);
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
      }
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function korToEng(str) {
      const engInitials = ["r","R","s","e","E","f","a","q","Q","t","T","d","w","W","c","z","x","v","g"];
      const engVowels = ["k","o","i","O","j","p","n","P","h","hk","ho","hl","y","n","nj","np","nl","l","m","ml","l"];
      const engFinals = ["","r","R","rt","s","sw","sg","e","f","fr","fa","fq","ft","fx","fv","fg","a","q","qt","t","T","d","w","c","z","x","v","g"];

      const directMap = {
        'ㄱ':'r', 'ㄲ':'R', 'ㄴ':'s', 'ㄷ':'e', 'ㄸ':'E', 'ㄹ':'f', 'ㅁ':'a', 'ㅂ':'q', 'ㅃ':'Q',
        'ㅅ':'t', 'ㅆ':'T', 'ㅇ':'d', 'ㅈ':'w', 'ㅉ':'W', 'ㅊ':'c', 'ㅋ':'z', 'ㅌ':'x', 'ㅍ':'v', 'ㅎ':'g',
        'ㅏ':'k', 'ㅐ':'o', 'ㅑ':'i', 'ㅒ':'O', 'ㅓ':'j', 'ㅔ':'p', 'ㅕ':'n', 'ㅖ':'P', 'ㅗ':'h',
        'ㅛ':'y', 'ㅜ':'n', 'ㅠ':'l', 'ㅡ':'m', 'ㅣ':'l'
      };

      let result = "";
      for (let i = 0; i < str.length; i++) {
        let code = str.charCodeAt(i);

        if (directMap[str[i]]) {
          result += directMap[str[i]];
          continue;
        }

        if (code >= 0xAC00 && code <= 0xD7A3) {
          let uniIndex = code - 0xAC00;
          let initial = Math.floor(uniIndex / 588);
          let vowel = Math.floor((uniIndex % 588) / 28);
          let final = uniIndex % 28;

          result += engInitials[initial] + engVowels[vowel] + engFinals[final];
        } else {
          result += str[i];
        }
      }
      return result;
    }

    function playSuccessBeep() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.08);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1320, now + 0.1);
        gain2.gain.setValueAtTime(0.3, now + 0.1);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.1);
        osc2.stop(now + 0.25);
      } catch (e) {
        console.error("오디오 재생 실패:", e);
      }
    }

    function playWarningBeep() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(220, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.15);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sawtooth';
        osc2.frequency.setValueAtTime(220, now + 0.18);
        gain2.gain.setValueAtTime(0.3, now + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.33);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.18);
        osc2.stop(now + 0.33);
      } catch (e) {
        console.error("오디오 재생 실패:", e);
      }
    }

    function focusInput() {
      const inputEl = document.getElementById('manual-input');
      if (inputEl) {
        inputEl.focus();
        inputEl.select();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-date').innerText = new Date().toLocaleDateString('ko-KR', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
      });
      
      restoreState();
      window.addEventListener('online', syncOfflineData);

      document.body.addEventListener('click', (e) => {
        if (document.getElementById('lock-screen').style.display === 'none') {
          if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
            focusInput();
          }
        }
      });
    });

    function fetchStudentList() {
      const statusBar = document.getElementById('db-status-bar');
      
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          if (data.result === 'success' && data.students) {
            studentDB = data.students;
            const count = Object.keys(studentDB).length;
            statusBar.innerText = `🟢 학생 명단 로드 완료 (${count}명 등록됨)`;
            statusBar.className = "db-status success";
            renderAttendanceList();
          } else {
            statusBar.innerText = "⚠️ 명단 불러오기 실패: '학생명단' 탭을 확인하세요.";
            statusBar.className = "db-status error";
          }
        })
        .catch(err => {
          console.error("명단 로드 실패:", err);
          statusBar.innerText = "⚠️ 명단 동기화 실패 (기존 일련번호로 표시됨)";
          statusBar.className = "db-status error";
        });
    }

    function resolveStudentIdentity(inputVal) {
      if (!studentDB) return { canonicalKey: inputVal, displayName: inputVal };

      if (studentDB[inputVal]) {
        return { canonicalKey: inputVal, displayName: studentDB[inputVal] };
      }

      for (let serialKey in studentDB) {
        const studentInfo = studentDB[serialKey];
        if (studentInfo.startsWith(inputVal) || studentInfo.includes(inputVal)) {
          return { canonicalKey: serialKey, displayName: studentInfo };
        }
      }

      return { canonicalKey: inputVal, displayName: inputVal };
    }

    function getStudentDisplay(code) {
      return resolveStudentIdentity(code).displayName;
    }

    function restoreState() {
      document.getElementById('count').innerText = `${attendanceData.length}명`;
      renderAttendanceList();
      updateOfflineStatus();
    }

    function setSortMode(mode) {
      currentSortMode = mode;
      document.getElementById('btn-sort-time').className = (mode === 'time') ? 'btn-sort active' : 'btn-sort';
      document.getElementById('btn-sort-class').className = (mode === 'class') ? 'btn-sort active' : 'btn-sort';
      renderAttendanceList();
    }

    // 📊 표(Table) 전용 데이터 렌더링 함수
    function renderAttendanceList() {
      const tbodyEl = document.getElementById('attendance-tbody');
      
      if (attendanceData.length === 0) {
        tbodyEl.innerHTML = '<tr><td colspan="3" class="empty-msg-td">아직 등록된 학생이 없습니다.</td></tr>';
        return;
      }

      let displayList = attendanceData.slice();

      if (currentSortMode === 'time') {
        displayList.reverse();
      } else if (currentSortMode === 'class') {
        displayList.sort((a, b) => {
          const nameA = getStudentDisplay(a.code);
          const nameB = getStudentDisplay(b.code);
          return nameA.localeCompare(nameB, 'ko-KR', { numeric: true });
        });
      }

      tbodyEl.innerHTML = displayList.map((item, idx) => {
        const num = (currentSortMode === 'time') ? (attendanceData.length - idx) : (idx + 1);
        const displayName = getStudentDisplay(item.code);
        return `
          <tr>
            <td class="col-num">${num}</td>
            <td class="col-info">${displayName}</td>
            <td class="col-time">${item.time}</td>
          </tr>
        `;
      }).join('');
    }

    function clearTodayData() {
      if (attendanceData.length === 0) {
        alert("초기화할 등록 내역이 없습니다.");
        return;
      }

      const confirmReset = confirm("오늘 등록된 전체 명단과 카운트를 초기화하시겠습니까?\n(※ 구글 시트에 이미 전송된 데이터는 지워지지 않습니다.)");
      if (confirmReset) {
        attendanceData = [];
        offlineQueue = [];
        localStorage.removeItem(`attendance_list_${todayKey}`);
        localStorage.removeItem(`offline_queue_${todayKey}`);
        
        restoreState();
        document.getElementById('feedback').innerText = "화면 데이터가 초기화되었습니다.";
        focusInput();
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;

      const rawVal = korToEng(decodedText.trim());
      const identity = resolveStudentIdentity(rawVal);
      const feedback = document.getElementById('feedback');

      const isDuplicate = attendanceData.some(item => {
        const itemIdentity = resolveStudentIdentity(item.code);
        return item.code === identity.canonicalKey || itemIdentity.canonicalKey === identity.canonicalKey;
      });

      if (isDuplicate) {
        isProcessing = true;
        playWarningBeep();
        feedback.innerText = `⚠️ 이미 출석 처리됨: [${identity.displayName}]`;
        feedback.classList.add('warning');
        setTimeout(() => {
          feedback.classList.remove('warning');
          feedback.innerText = "카메라로 바코드를 비춰주세요.";
          isProcessing = false;
        }, 1200);
        return;
      }

      isProcessing = true;
      saveAttendance(identity.canonicalKey);

      setTimeout(() => {
        isProcessing = false;
        feedback.innerText = "다음 바코드를 비춰주세요.";
      }, 1200);
    }

    document.getElementById('manual-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('manual-input');
      const rawInput = input.value.trim();

      input.value = '';

      if (!rawInput || isProcessing) {
        focusInput();
        return;
      }

      const convertedVal = korToEng(rawInput);
      const identity = resolveStudentIdentity(convertedVal);
      isProcessing = true;

      const isDuplicate = attendanceData.some(item => {
        const itemIdentity = resolveStudentIdentity(item.code);
        return item.code === identity.canonicalKey || itemIdentity.canonicalKey === identity.canonicalKey;
      });

      if (isDuplicate) {
        playWarningBeep();
        document.getElementById('feedback').innerText = `⚠️ 이미 출석 처리됨: [${identity.displayName}]`;
        document.getElementById('feedback').classList.add('warning');
        
        setTimeout(() => {
          input.value = '';
          focusInput();
        }, 50);

        setTimeout(() => {
          document.getElementById('feedback').classList.remove('warning');
          document.getElementById('feedback').innerText = "바코드를 스캔하거나 학번을 입력하세요.";
          isProcessing = false;
        }, 1000);
        return;
      }

      saveAttendance(identity.canonicalKey);
      
      setTimeout(() => {
        input.value = '';
        focusInput();
        isProcessing = false;
      }, 300);
    });

    function saveAttendance(rawCode) {
      playSuccessBeep();

      const timeString = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const newRecord = { code: rawCode, time: timeString };

      attendanceData.push(newRecord);
      localStorage.setItem(`attendance_list_${todayKey}`, JSON.stringify(attendanceData));

      const studentName = getStudentDisplay(rawCode);
      document.getElementById('count').innerText = `${attendanceData.length}명`;
      document.getElementById('feedback').innerText = `✅ [${studentName}] 등록 완료!`;
      
      renderAttendanceList();

      offlineQueue.push(rawCode);
      localStorage.setItem(`offline_queue_${todayKey}`, JSON.stringify(offlineQueue));
      updateOfflineStatus();

      sendToGoogleSheet(rawCode);
    }

    function sendToGoogleSheet(rawText) {
      if (!navigator.onLine) {
        console.log("오프라인 상태: 저장소에 보관 후 추후 전송");
        return;
      }

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raw_qr: rawText })
      })
      .then(() => {
        offlineQueue = offlineQueue.filter(item => item !== rawText);
        localStorage.setItem(`offline_queue_${todayKey}`, JSON.stringify(offlineQueue));
        updateOfflineStatus();
      })
      .catch(err => console.error("전송 오류:", err));
    }

    function syncOfflineData() {
      if (offlineQueue.length === 0) return;
      const itemsToSync = [...offlineQueue];
      itemsToSync.forEach(item => sendToGoogleSheet(item));
    }

    function updateOfflineStatus() {
      const statusEl = document.getElementById('offline-count-status');
      statusEl.innerText = `미전송 대기: ${offlineQueue.length}건`;
    }

    function startCamera() {
      if (isCameraRunning) return;

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const cameraConfig = { facingMode: "environment" };
      const scannerConfig = { 
        fps: 20, 
        qrbox: { width: 280, height: 130 },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };

      html5QrCode.start(cameraConfig, scannerConfig, onScanSuccess)
        .then(() => {
          isCameraRunning = true;
          updateCamBtnUI(true);
          document.getElementById('feedback').innerText = "카메라로 바코드를 비춰주세요.";
        })
        .catch(err => {
          console.error("카메라 에러:", err);
          document.getElementById('feedback').innerText = "카메라 연결 실패 또는 권한 없음";
          updateCamBtnUI(false);
        });
    }

    function stopCamera() {
      if (html5QrCode && isCameraRunning) {
        html5QrCode.stop()
          .then(() => {
            isCameraRunning = false;
            updateCamBtnUI(false);
            document.getElementById('feedback').innerText = "카메라가 꺼져 있습니다.";
            focusInput();
          })
          .catch(err => {
            console.error("카메라 중지 에러:", err);
            isCameraRunning = false;
            updateCamBtnUI(false);
          });
      }
    }

    function toggleCamera() {
      if (isCameraRunning) {
        stopCamera();
      } else {
        startCamera();
      }
    }

    function updateCamBtnUI(running) {
      const btn = document.getElementById('cam-toggle-btn');
      if (running) {
        btn.innerText = "카메라 끄기";
        btn.className = "btn-cam stop";
      } else {
        btn.innerText = "카메라 켜기";
        btn.className = "btn-cam start";
      }
    }
  </script>
</body>
</html>
